<script>
(function () {
  var q = document.getElementById('q');
  var results = document.getElementById('results');
  var meta = document.getElementById('meta');
  var index = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function score(item, query) {
    var qi = item.title + ' ' + item.kicker;
    var ti = item.text;
    if (qi.indexOf(query) >= 0) return 6;
    var toks = query.split(/\s+/).filter(Boolean);
    var s = 0;
    toks.forEach(function (t) {
      if (qi.indexOf(t) >= 0) s += 3;
      else if (ti.indexOf(t) >= 0) s += 1;
    });
    if (s === 0 && query.length >= 2) {
      // CJK: try two-character windows
      for (var i = 0; i < query.length - 1; i++) {
        var bigram = query.slice(i, i + 2);
        if (qi.indexOf(bigram) >= 0) s += 2;
        else if (ti.indexOf(bigram) >= 0) s += 1;
      }
    }
    return s;
  }

  function snippet(item, query) {
    var t = item.desc || item.text || '';
    var at = t.indexOf(query);
    if (at > 40) t = '…' + t.slice(at - 30);
    t = t.slice(0, 150);
    return t;
  }

  function render() {
    var query = (q.value || '').trim();
    if (!index) return;
    if (!query) {
      results.innerHTML = '';
      meta.textContent = index.length + ' 条内容，输入关键词开始';
      return;
    }
    var hits = index
      .map(function (item) { return { item: item, s: score(item, query) }; })
      .filter(function (h) { return h.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 12);
    meta.textContent = hits.length ? '找到 ' + hits.length + ' 条' : '没有匹配的内容';
    results.innerHTML = hits.length
      ? hits.map(function (h) {
          return '<a class="result" href="' + h.item.url + '"><div><h3>' + esc(h.item.title) +
            '</h3><p>' + esc(snippet(h.item, query)) + '</p></div><span>' +
            esc(h.item.date ? h.item.date.slice(0, 10) : '页面') + '</span></a>';
        }).join('')
      : '<p class="note-line" style="padding:1.4rem 0">换个词试试，比如“端口”“框架”“日志”。</p>';
  }

  fetch('/search-index.json').then(function (r) { return r.json(); }).then(function (data) {
    index = data;
    var preset = new URLSearchParams(location.search).get('q');
    if (preset) q.value = preset;
    render();
  }).catch(function () {
    meta.textContent = '索引加载失败，刷新试试';
  });

  q.addEventListener('input', render);
})();
</script>
</body>
</html>
