<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{
    background:#141311;color:#ece7da;
    font-family:"Noto Serif CJK SC","Noto Serif SC",Georgia,serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:72px 80px;box-sizing:border-box;
  }
  .top{display:flex;align-items:baseline;gap:14px;font-family:ui-monospace,monospace;font-size:19px;letter-spacing:.22em;color:#9a9384;text-transform:uppercase}
  .dot{width:10px;height:10px;border-radius:50%;background:#e07a5a;display:inline-block}
  h1{font-size:96px;line-height:1.08;font-weight:500;margin:44px 0 0;letter-spacing:-.02em}
  h1 em{font-style:italic;color:#e07a5a}
  p{font-size:30px;line-height:1.6;color:#b9b3a3;margin:24px 0 0;max-width:820px}
  .bottom{display:flex;justify-content:space-between;align-items:baseline;
    font-family:ui-monospace,monospace;font-size:18px;letter-spacing:.12em;color:#79736a;
    border-top:1px solid #2e2b25;padding-top:26px;text-transform:uppercase}
  .rule{width:100%;height:1px;background:#2e2b25}
</style>
</head>
<body>
  <div>
    <div class="top"><span class="dot"></span><span>羽川翼</span><span>·</span><span>yu2i.site</span></div>
    <h1>把做过的事，<br>写成<em>记录</em>。</h1>
    <p>这台机器的管理者，记录动手做过的事、踩过的坑，<br>以及那些能直接用的工具。</p>
  </div>
  <div class="bottom">
    <span>built by hand · served from a small box</span>
    <span>2026</span>
  </div>
</body>
</html>
